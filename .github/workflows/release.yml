name: Release (Windows)

# Pushing a tag like v1.2.0 builds the Windows desktop app and attaches it to a
# GitHub release. The Docker image for the same tag is published by docker.yml.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install mingw-w64 (Windows cross-compiler)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Test
        run: go test ./internal/... ./garmin/... ./mywhoosh/... ./cmd/...

      - name: Build Windows GUI
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: |
          go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.version=${GITHUB_REF_NAME}" \
            -o mywhoosh2garmin-windows-amd64.exe .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mywhoosh2garmin-windows-amd64.exe
