name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: Vet (headless packages)
        run: go vet ./internal/... ./garmin/... ./mywhoosh/... ./cmd/...
      - name: Test (headless packages, race detector)
        run: go test -race ./internal/... ./garmin/... ./mywhoosh/... ./cmd/...
      - name: Build server (CGO disabled)
        run: CGO_ENABLED=0 go build -trimpath -o bin/server ./cmd/server

  # Makes sure the Windows desktop app still compiles (same cross-compile as the release).
  windows-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build Windows GUI
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o bin/mywhoosh2garmin.exe .

  # Builds the multi-arch image without pushing (publishing happens in docker.yml).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
