name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test (headless packages)
        run: go test ./internal/... ./garmin/... ./mywhoosh/... ./cmd/...
      - name: Vet
        run: go vet ./internal/... ./garmin/... ./mywhoosh/... ./cmd/...
      - name: Build server (CGO disabled)
        run: CGO_ENABLED=0 go build -trimpath -o bin/server ./cmd/server

  gui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl-dev xorg-dev libxxf86vm-dev
      - name: Build desktop GUI
        run: CGO_ENABLED=1 go build -trimpath -o bin/mywhoosh2garmin .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t fittogarmin:ci .